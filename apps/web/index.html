<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>TrainerKit</title>
    <meta
      name="description"
      content="Decide o que fazer com cada Pokémon: investir, evoluir, guardar ou transferir."
    />

    <!-- A cor da barra do sistema segue o tema, senao fica uma faixa clara no topo do app escuro. -->
    <meta name="theme-color" content="#07080B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)" />

    <!-- iOS: sem isto o app abre em aba do Safari em vez de standalone.
         `mobile-web-app-capable` e o nome padronizado (o Chrome depreciou o
         prefixado); o Safari ainda le o `apple-`. Os dois ficam. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrainerKit" />
    <!-- Escuro e o padrao: e como o app abre, e e o `background_color` do
         manifest. O iOS copia UM arquivo na hora de instalar e nao volta a
         olhar, entao o icone instalado nao muda depois — o `media` aqui so
         decide qual e copiado, quando o Safari o respeita. -->
    <link
      rel="apple-touch-icon"
      href="/apple-touch-icon-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />

    <!-- Dois tamanhos renderizados NO tamanho, nao encolhidos do 512: a marca
         sao tres barras finas, e o navegador reamostrando a imagem grande as
         funde num borrao. Nesses dois a seta sai do desenho de proposito — ver
         `scripts/make-icons.ts`. -->
    <!-- O favicon TROCA sozinho com o tema: `media` em `rel="icon"` e
         respeitado pelos navegadores atuais. A ordem importa — a regra clara
         vem primeiro e a escura fica como padrao pra quem nao avalia `media`. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/favicon-32-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/favicon-16-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16.png" />

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
