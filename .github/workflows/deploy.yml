name: Deploy

# O dataset NAO e versionado. Ele e gerado aqui, a cada deploy, a partir do
# GAME_MASTER publico — o que mantem o repositorio contendo apenas codigo e faz
# o site publicado nascer com o dado do dia em vez do dia do ultimo commit.
on:
  push:
    branches: [main]
  # Roda sozinho de madrugada: o jogo muda a cada poucos dias, e um app que
  # decide com base velha decide errado com confianca.
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Sem `version`: o `packageManager` do package.json ja fixa a versao, e
      # declarar nos dois lugares faz a action abortar por ambiguidade.
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Checagem de tipos
        run: pnpm -r typecheck

      # ANTES dos testes, de proposito: eles conferem a matematica contra o
      # dataset real (PC do Machamp, stats base pela conversao da serie
      # principal, PC de chefe de raide). Rodar antes de gerar quebraria por
      # arquivo ausente — e, pior, testar um dataset diferente do que vai ao ar
      # nao provaria nada sobre o que foi publicado.
      #
      # Precisa de rede: baixa o GAME_MASTER (18 MB) e transforma. Se a fonte
      # estiver fora do ar o deploy para aqui, o que e melhor que publicar sem
      # dado.
      - name: Gerar o dataset
        run: pnpm --filter @trainerkit/dataset refresh

      - name: Testes
        run: pnpm -r test

      - name: Build
        # Pages de projeto serve em /<repo>/, nao na raiz. O build tambem roda
        # a auditoria que falha se alguma arte de terceiros entrar no bundle.
        env:
          TK_BASE: /${{ github.event.repository.name }}/
          # A funcao que guarda a chave compartilhada da IA. Sem esta variavel a
          # opcao "gratis" nem aparece na tela — e assim que era ate agora.
          VITE_TK_AI_PROXY: https://trainerkit-ia.vercel.app/api/ai
        run: pnpm --filter ./apps/web build

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
