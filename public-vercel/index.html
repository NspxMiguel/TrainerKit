<h1>TrainerKit · IA</h1>
<p>Isto é só o proxy da chave compartilhada do TrainerKit. Não há nada para ver aqui.</p>
<p>O endpoint é <code>POST /api/ai</code>. Ele guarda a chave da Groq no servidor,
   limita tamanho, modelo e frequência, e <strong>não registra o conteúdo</strong>
   de nenhuma pergunta.</p>
<p>O app fica em <a href="https://trainerkit.vercel.app/">trainerkit.vercel.app</a>.</p>
