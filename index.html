<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="utf-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=5"
    />
    <title>TrainerKit</title>
    <meta
      name="description"
      content="Decide o que fazer com cada espécie: investir, evoluir, guardar ou transferir."
    />

    <!-- A cor da barra do sistema segue o tema, senao fica uma faixa clara no topo do app escuro. -->
    <!--
      Como o link aparece quando alguem cola o endereco num chat.

      Sem estas linhas o WhatsApp, o Discord e o Twitter mostram so a URL crua —
      um app que se apresenta assim parece um link suspeito, e o primeiro
      contato de quase todo mundo com o TrainerKit e alguem mandando o link.

      A imagem e o icone de 512 do proprio app: arte propria, gerada por
      `scripts/make-icons.ts`. Nenhuma arte de terceiro entra aqui, pelo mesmo
      motivo de nenhuma entrar no bundle.
    -->
    <meta property="og:type" content="website" />
    <meta property="og:title" content="TrainerKit" />
    <meta
      property="og:description"
      content="Decide o que fazer com cada espécie: investir, evoluir, guardar ou transferir."
    />
    <meta property="og:image" content="./icon-512.png" />
    <meta name="twitter:card" content="summary" />

    <meta name="theme-color" content="#07080B" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ECEEF3" media="(prefers-color-scheme: light)" />

    <!-- iOS: sem isto o app abre em aba do Safari em vez de standalone.
         `mobile-web-app-capable` e o nome padronizado (o Chrome depreciou o
         prefixado); o Safari ainda le o `apple-`. Os dois ficam. -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="TrainerKit" />
    <!-- ⚠️ UM SO `apple-touch-icon`, e o escuro. A variante clara com `media`
         estava aqui e foi TIRADA: o iOS copia UM arquivo na hora de instalar e
         nunca mais olha, entao quem instalasse de dia levava pra sempre o tile
         branco — foi o que apareceu numa instalacao de verdade: um quadrado
         branco com um ovo preto dentro, enquanto o app abre no escuro.
         O `media` nao "escolhe melhor", ele sorteia pelo horario da instalacao.
         O claro continua sendo gerado e continua servindo o favicon, que esse
         sim troca sozinho. -->
    <link rel="apple-touch-icon" href="/TrainerKit/apple-touch-icon.png" />

    <!-- Dois tamanhos renderizados NO tamanho, nao encolhidos do 512: a marca
         sao tres barras finas, e o navegador reamostrando a imagem grande as
         funde num borrao. Nesses dois a seta sai do desenho de proposito — ver
         `scripts/make-icons.ts`. -->
    <!-- O favicon TROCA sozinho com o tema: `media` em `rel="icon"` e
         respeitado pelos navegadores atuais. A ordem importa — a regra clara
         vem primeiro e a escura fica como padrao pra quem nao avalia `media`. -->
    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="/TrainerKit/favicon-32-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="16x16"
      href="/TrainerKit/favicon-16-light.png"
      media="(prefers-color-scheme: light)"
    />
    <link rel="icon" type="image/png" sizes="32x32" href="/TrainerKit/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/TrainerKit/favicon-16.png" />

    <!--
      ⚠️ AS FONTES SAO DA MESMA ORIGEM, e nao do CDN do Google.

      Aqui havia dois `preconnect` e um `stylesheet` apontando pra
      `fonts.googleapis.com`. A tela de Privacidade promete, com estas palavras:
      "Se voce deixar a IA e a voz desligadas, NADA SAI" — e lista quem recebe
      algo (Groq, Microsoft, ElevenLabs, Vercel, GitHub Pages). O Google nao
      estava na lista, e mesmo assim toda abertura do app entregava IP e
      User-Agent pra ele, antes de a pessoa tocar em nada.

      Havia duas saidas: declarar o Google, ou tirar o Google. A segunda deixa a
      frase verdadeira em vez de menor — e conserta o offline de quebra, porque
      sem internet o app caia pra fonte do sistema e mudava de cara.

      Os arquivos vem de `pnpm --filter @trainerkit/web fontes`, que o `build`
      roda antes. Ver a nota longa em `scripts/fetch-fontes.ts`, inclusive a
      licenca (SIL OFL 1.1, que permite redistribuir).
    -->
    <link href="/TrainerKit/fontes/fontes.css" rel="stylesheet" />
    <script type="module" crossorigin src="/TrainerKit/assets/index-BGFOePe4.js"></script>
    <link rel="modulepreload" crossorigin href="/TrainerKit/assets/react-yhHQWoh4.js">
    <link rel="modulepreload" crossorigin href="/TrainerKit/assets/i18n-tzYZKJg8.js">
    <link rel="stylesheet" crossorigin href="/TrainerKit/assets/index-ykbke8GX.css">
  <link rel="manifest" href="/TrainerKit/manifest.webmanifest"></head>
  <body>
    <div id="root"></div>
  </body>
</html>
